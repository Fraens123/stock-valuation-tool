metrics:
  roe:
    group: profitability
    title_de: "Eigenkapitalrendite"
    title_en: "Return on Equity (ROE)"
    chapter: "2.1"
    kindle_page: 94
    status: adjust_verify_book
    excel_location: "Krones!I3:M8"
    excel_formula: "Net Income / year-end Equity (Excel: B17/B63)"
    target_formula: "Net Income / durchschnittliches Eigenkapital; genaue Buchdefinition gegen S. 94 verifizieren"
    raw_data: [net_income, total_equity]
    definition: "Rendite, die das Unternehmen auf das den Eigentümern zurechenbare Eigenkapital erwirtschaftet."
    meaning: "Die Eigenkapitalrendite verbindet den Gewinn mit dem Kapital, das den Aktionären bilanziell zuzurechnen ist. Sie ist besonders nützlich, um die Ertragskraft des Eigenkapitals über mehrere Jahre zu beurteilen."
    interpretation: "Hohe und stabile Werte können auf ein starkes Geschäftsmodell hindeuten. Eine hohe ROE allein ist jedoch kein Qualitätsbeweis, weil Fremdkapital und ein stark reduziertes Eigenkapital die Kennzahl nach oben treiben können."
    pitfalls: ["Leverage kann ROE künstlich erhöhen.", "Sondereffekte im Gewinn verzerren.", "Aktienrückkäufe können das Eigenkapital reduzieren."]
    related: [equity_ratio, gearing, roce]

  return_on_sales:
    group: profitability
    title_de: "Umsatzrendite"
    title_en: "Return on Sales"
    chapter: "2.2"
    kindle_page: 101
    status: keep_verify_book
    excel_location: "Krones!I15:M20"
    excel_formula: "Net Income attributable to shareholders / Revenue (Excel: B18/B2)"
    target_formula: "Jahresüberschuss / Umsatz; Zählerdefinition gegen Buch verifizieren"
    raw_data: [revenue, net_income_attributable]
    definition: "Anteil des Umsatzes, der nach den berücksichtigten Aufwendungen als Ergebnis verbleibt."
    meaning: "Zeigt, wie viel Ergebnis pro Einheit Umsatz erwirtschaftet wird und gibt Hinweise auf Preissetzungsmacht, Kostenstruktur und Wettbewerbsintensität."
    interpretation: "Eine über lange Zeit hohe oder steigende Umsatzrendite ist häufig ein positives Signal. Entscheidend sind Stabilität, Branchenvergleich und die Ursache der Margenentwicklung."
    pitfalls: ["Branchen haben strukturell sehr unterschiedliche Margen.", "Einmalige Erträge/Aufwendungen verzerren."]
    related: [ebit_margin, roa, fair_pe]

  ebit_margin:
    group: profitability
    title_de: "EBIT-Marge"
    title_en: "EBIT Margin"
    chapter: "2.3"
    kindle_page: 105
    status: keep
    excel_location: "Krones!I27:M32"
    excel_formula: "EBIT / Revenue (Excel: B12/B2)"
    target_formula: "EBIT / Umsatz"
    raw_data: [revenue, ebit]
    definition: "Operatives Ergebnis vor Zinsen und Steuern im Verhältnis zum Umsatz."
    meaning: "Misst die operative Profitabilität weitgehend unabhängig von Kapitalstruktur und Steuerumfeld."
    interpretation: "Stabile oder steigende EBIT-Margen sprechen für belastbare operative Ertragskraft; Margendruck kann auf Wettbewerb, Kostenprobleme oder Zyklik hinweisen."
    pitfalls: ["Sondereffekte im EBIT normalisieren.", "Bilanzierungsunterschiede können Vergleiche beeinflussen."]
    related: [ebitda_margin, return_on_sales, ev_ebit]

  ebitda_margin:
    group: profitability
    title_de: "EBITDA-Marge"
    title_en: "EBITDA Margin"
    chapter: "2.3"
    kindle_page: 105
    status: keep
    excel_location: "Krones!I27:M37"
    excel_formula: "(EBIT + Depreciation/Amortization) / Revenue (Excel: (B12+B70)/B2)"
    target_formula: "EBITDA / Umsatz"
    raw_data: [revenue, ebit, depreciation_amortization]
    definition: "Operatives Ergebnis vor Zinsen, Steuern und Abschreibungen im Verhältnis zum Umsatz."
    meaning: "Erlaubt einen Blick auf die operative Ertragskraft vor Abschreibungen und ist vor allem für EV/EBITDA-Vergleiche relevant."
    interpretation: "Eine hohe EBITDA-Marge ist positiv, darf bei kapitalintensiven Unternehmen aber nicht mit freiem Cashflow verwechselt werden."
    pitfalls: ["Ignoriert Ersatz- und Wachstumsinvestitionen.", "Kann kapitalintensive Geschäftsmodelle zu attraktiv erscheinen lassen."]
    related: [ebit_margin, ev_ebitda, capex_ratio]

  capital_turnover:
    group: profitability
    title_de: "Kapitalumschlag"
    title_en: "Capital Turnover"
    chapter: "2.4"
    kindle_page: 107
    status: add_from_book
    excel_location: null
    excel_formula: null
    target_formula: "Umsatz / durchschnittlich eingesetztes Gesamtkapital; genaue Buchdefinition verifizieren"
    raw_data: [revenue, total_assets]
    definition: "Misst, wie viel Umsatz mit einer Einheit eingesetzten Kapitals erwirtschaftet wird."
    meaning: "Ergänzt Margenkennzahlen um die Kapitalintensität. Ein Unternehmen kann mit niedriger Marge attraktiv sein, wenn das Kapital sehr effizient umgeschlagen wird."
    interpretation: "Ein hoher und stabiler Kapitalumschlag spricht für effizienten Kapitaleinsatz, muss aber im Geschäftsmodellkontext interpretiert werden."
    pitfalls: ["Asset-light und kapitalintensive Branchen nicht unkritisch vergleichen."]
    related: [roa, roce, asset_intensity]

  roa:
    group: profitability
    title_de: "Gesamtkapitalrendite"
    title_en: "Return on Assets (ROA)"
    chapter: "2.5"
    kindle_page: 109
    status: keep_verify_book
    excel_location: "Krones!I39:M43"
    excel_formula: "(Net Income + interest expense) / Total capital (Excel: (B17+I183)/B64)"
    target_formula: "Genaue Zähler-/Nennerdefinition gegen S. 109 verifizieren"
    raw_data: [net_income, interest_expense, total_assets]
    definition: "Rendite auf das gesamte im Unternehmen gebundene Kapital beziehungsweise Vermögen."
    meaning: "Zeigt, wie effizient das Unternehmen unabhängig von der reinen Eigenkapitalperspektive wirtschaftet."
    interpretation: "Für die Qualitätsbeurteilung ist vor allem die Entwicklung über mehrere Jahre und im Branchenvergleich relevant."
    pitfalls: ["Zinsaufwand muss konsistent behandelt werden.", "Hoher Goodwill kann die Kennzahl drücken."]
    related: [roe, capital_turnover, roce]

  roce:
    group: profitability
    title_de: "Return on Capital Employed"
    title_en: "Return on Capital Employed (ROCE)"
    chapter: "2.6"
    kindle_page: 111
    status: keep_verify_book
    excel_location: "Krones!I45:M50"
    excel_formula: "EBIT / (Total capital - current liabilities) (Excel: B12/(B64-B50))"
    target_formula: "EBIT / Capital Employed; Bestandteile des Capital Employed gegen Buch verifizieren"
    raw_data: [ebit, total_assets, current_liabilities]
    definition: "Operative Rendite auf das langfristig im operativen Geschäft eingesetzte Kapital."
    meaning: "ROCE verbindet operative Profitabilität und Kapitalbedarf und ist deshalb eine zentrale Qualitätskennzahl für kapitalgebundene Unternehmen."
    interpretation: "Dauerhaft hohe Werte sind besonders interessant, wenn sie ohne übermäßige Verschuldung erzielt werden."
    pitfalls: ["Definition von Capital Employed muss über alle Unternehmen konsistent sein.", "Sondereffekte im EBIT normalisieren."]
    related: [roe, roa, capital_turnover]

  sales_earning_rate:
    group: profitability
    title_de: "Umsatzverdienstrate"
    title_en: null
    chapter: "2.7"
    kindle_page: 114
    status: add_from_book
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch S. 114 festlegen"
    raw_data: []
    definition: "Buchkennzahl, die im bestehenden Excel noch nicht separat umgesetzt ist."
    meaning: "Wird erst nach Prüfung der konkreten Schmidlin-Definition implementiert."
    interpretation: "Noch offen."
    pitfalls: ["Nicht aus einer ähnlich benannten Standardkennzahl ableiten; Buchdefinition zuerst prüfen."]
    related: [return_on_sales]

  equity_ratio:
    group: financial_stability
    title_de: "Eigenkapitalquote"
    title_en: "Equity Ratio"
    chapter: "3.1"
    kindle_page: 118
    status: keep
    excel_location: "Krones!I59:M65"
    excel_formula: "Equity / Total capital (Excel: B63/B64)"
    target_formula: "Eigenkapital / Bilanzsumme"
    raw_data: [total_equity, total_assets]
    definition: "Anteil des Eigenkapitals an der Bilanzsumme."
    meaning: "Beschreibt die finanzielle Pufferwirkung des Eigenkapitals und die Abhängigkeit von Fremdfinanzierung."
    interpretation: "Eine höhere Quote kann Widerstandsfähigkeit erhöhen, ist aber immer mit Kapitalintensität, Planbarkeit und Branche zu beurteilen."
    pitfalls: ["Finanzunternehmen benötigen andere Maßstäbe.", "Goodwill und Bilanzierungsregeln beeinflussen die Quote."]
    related: [gearing, dynamic_debt_ratio, asset_coverage_i]

  gearing:
    group: financial_stability
    title_de: "Gearing"
    title_en: "Gearing"
    chapter: "3.2"
    kindle_page: 124
    status: keep_verify_book
    excel_location: "Krones!I70:M76"
    excel_formula: "(interest-bearing debt - cash) / Equity (Excel: (manual interest-bearing debt - cash)/equity)"
    target_formula: "Nettofinanzverschuldung / Eigenkapital"
    raw_data: [interest_bearing_debt, cash_and_short_term_investments, total_equity]
    definition: "Verhältnis der Nettofinanzverschuldung zum Eigenkapital."
    meaning: "Zeigt, wie stark das Eigenkapital durch verzinsliche Nettoschulden gehebelt wird."
    interpretation: "Niedrige oder negative Werte sind meist komfortabler; zulässige Werte hängen von Cashflow-Stabilität und Geschäftsmodell ab."
    pitfalls: ["Nur zinstragende Schulden sauber definieren.", "Leasingverbindlichkeiten konsistent behandeln."]
    related: [equity_ratio, dynamic_debt_ratio, net_debt_ebitda]

  dynamic_debt_ratio:
    group: financial_stability
    title_de: "Dynamischer Verschuldungsgrad"
    title_en: "Dynamic Debt Ratio"
    chapter: "3.3"
    kindle_page: 129
    status: keep_verify_book
    excel_location: "Krones!I85:M90"
    excel_formula: "Net debt / Free Cash Flow (Excel uses row97 as FCF)"
    target_formula: "Nettofinanzverschuldung / nachhaltiger Free Cash Flow; Buchdefinition verifizieren"
    raw_data: [interest_bearing_debt, cash_and_short_term_investments, free_cash_flow]
    definition: "Nähert an, wie viele Jahre der freie Cashflow zur Tilgung der Nettofinanzverschuldung benötigen würde."
    meaning: "Verbindet Schuldenhöhe mit tatsächlich verfügbarer Tilgungskraft und ist dadurch aussagekräftiger als reine Bilanzquoten."
    interpretation: "Je niedriger, desto höher typischerweise der finanzielle Spielraum. Negative Nettoverschuldung muss separat dargestellt werden."
    pitfalls: ["Zyklisch hoher FCF kann die Kennzahl zu gut aussehen lassen.", "Negative Nettofinanzverschuldung nicht als normale Quote interpretieren."]
    related: [gearing, net_debt_ebitda, free_cash_flow]

  net_debt_ebitda:
    group: financial_stability
    title_de: "Net Debt/EBITDA"
    title_en: "Net Debt / EBITDA"
    chapter: "3.4"
    kindle_page: 135
    status: keep
    excel_location: "Krones!I96:M99"
    excel_formula: "Net debt / (EBIT + D&A) (Excel: (interest-bearing debt-cash)/(EBIT+D&A))"
    target_formula: "Nettofinanzverschuldung / EBITDA"
    raw_data: [interest_bearing_debt, cash_and_short_term_investments, ebit, depreciation_amortization]
    definition: "Nettofinanzverschuldung im Verhältnis zum EBITDA."
    meaning: "Gibt eine grobe Vorstellung davon, wie groß die Finanzverschuldung im Verhältnis zur operativen Ergebniskraft ist."
    interpretation: "Niedrige Werte stehen meist für mehr finanziellen Spielraum; die Aussagekraft sinkt bei stark schwankendem EBITDA."
    pitfalls: ["EBITDA ignoriert Investitionsbedarf.", "Leasing und Pensionsverpflichtungen konsistent behandeln."]
    related: [dynamic_debt_ratio, gearing, ev_ebitda]

  capex_ratio:
    group: financial_stability
    title_de: "Sachinvestitionsquote"
    title_en: "Capital Expenditure Ratio"
    chapter: "3.5"
    kindle_page: 136
    status: keep_verify_book
    excel_location: "Krones!I104:M109"
    excel_formula: "PPE Capex / Operating Cash Flow (Excel: -B79/B95)"
    target_formula: "Sachinvestitionen / operativer Cashflow; genaue Cashflow-Zeile gegen Buch verifizieren"
    raw_data: [capex_ppe, operating_cash_flow]
    definition: "Anteil des operativen Cashflows, der für Sachinvestitionen benötigt wird."
    meaning: "Zeigt, wie kapitalintensiv das Geschäftsmodell ist und wie viel operativ erwirtschafteter Cashflow wieder gebunden wird."
    interpretation: "Niedrige Werte können attraktiv sein, solange nicht auf notwendige Ersatzinvestitionen verzichtet wird."
    pitfalls: ["Wachstums-CAPEX und Erhaltungs-CAPEX werden meist nicht getrennt ausgewiesen.", "Ein einzelnes Investitionsjahr ist wenig aussagekräftig."]
    related: [growth_ratio, asset_wear, free_cash_flow]

  asset_wear:
    group: financial_stability
    title_de: "Anlagenabnutzungsgrad"
    title_en: null
    chapter: "3.6"
    kindle_page: 141
    status: add_from_book
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch S. 141 festlegen"
    raw_data: []
    definition: "Buchkennzahl zur Beurteilung des Alters beziehungsweise der bilanziellen Abnutzung des Anlagevermögens."
    meaning: "Kann Hinweise auf künftig steigenden Ersatzinvestitionsbedarf geben."
    interpretation: "Hohe Abnutzung kann ein Warnsignal sein, wenn gleichzeitig zu wenig investiert wird."
    pitfalls: ["Benötigt geeignete Brutto-/Netto-Anlagenwerte; Providerdaten reichen nicht immer aus."]
    related: [capex_ratio, growth_ratio]

  growth_ratio:
    group: financial_stability
    title_de: "Wachstumsquote"
    title_en: "Growth Ratio"
    chapter: "3.7"
    kindle_page: 144
    status: keep_verify_book
    excel_location: "Krones!I115:M120"
    excel_formula: "Capex / D&A (Excel: -B96/B70)"
    target_formula: "Investitionen / Abschreibungen; genaue CAPEX-Zeile gegen Buch verifizieren"
    raw_data: [capex, depreciation_amortization]
    definition: "Setzt Investitionen in Relation zu Abschreibungen."
    meaning: "Hilft einzuschätzen, ob das Unternehmen seine bestehende Substanz lediglich ersetzt oder darüber hinaus investiert."
    interpretation: "Werte über 100 % können auf Expansion hindeuten; Werte unter 100 % sind nicht automatisch negativ und müssen über mehrere Jahre erklärt werden."
    pitfalls: ["Akquisitionen und immaterielle Investitionen können außerhalb der einfachen Kennzahl liegen."]
    related: [capex_ratio, asset_wear]

  cash_burn_rate:
    group: financial_stability
    title_de: "Cash-Burn-Rate"
    title_en: "Cash Burn Rate"
    chapter: "3.8"
    kindle_page: 145
    status: add_special_case
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch S. 145 festlegen; nur bei negativen Cashflows sinnvoll"
    raw_data: [cash_and_short_term_investments, free_cash_flow]
    definition: "Kennzahl zur Abschätzung, wie lange vorhandene Liquidität bei negativem Mittelabfluss reicht."
    meaning: "Vor allem für junge, verlustreiche oder in einer Sanierung befindliche Unternehmen relevant."
    interpretation: "Für profitable Unternehmen ohne Cash-Burn soll die Kennzahl als nicht anwendbar erscheinen."
    pitfalls: ["Nicht mechanisch auf profitable Unternehmen anwenden."]
    related: [cash_ratio, free_cash_flow]

  current_asset_intensity:
    group: financial_stability
    title_de: "Umlaufintensität"
    title_en: "Current Asset Intensity"
    chapter: "3.9"
    kindle_page: 148
    status: keep
    excel_location: "Krones!I127:M131"
    excel_formula: "Current assets / Total assets (Excel: B34/B42)"
    target_formula: "Umlaufvermögen / Bilanzsumme"
    raw_data: [current_assets, total_assets]
    definition: "Anteil des Umlaufvermögens an der Bilanzsumme."
    meaning: "Zeigt, welcher Anteil des Vermögens kurzfristiger und typischerweise flexibler gebunden ist."
    interpretation: "Die optimale Struktur hängt stark vom Geschäftsmodell ab."
    pitfalls: ["Ein starker Anstieg kann auch auf Forderungs- oder Lagerprobleme hindeuten."]
    related: [fixed_asset_intensity, current_ratio]

  fixed_asset_intensity:
    group: financial_stability
    title_de: "Anlagenintensität"
    title_en: "Fixed Asset Intensity"
    chapter: "3.9"
    kindle_page: 148
    status: keep_verify_mapping
    excel_location: "Krones!I137:M142"
    excel_formula: "Long-term assets / Total capital (Excel: B41/B64)"
    target_formula: "Anlagevermögen / Bilanzsumme; Excel-Zeile 41 gegen normalisierte API-Felder prüfen"
    raw_data: [non_current_assets, total_assets]
    definition: "Anteil langfristig gebundenen Vermögens an der Bilanzsumme."
    meaning: "Hohe Anlagenintensität weist meist auf einen höheren langfristigen Kapitalbedarf und geringere kurzfristige Anpassungsfähigkeit hin."
    interpretation: "Nicht isoliert bewerten; hohe Anlagenintensität kann bei planbaren Geschäftsmodellen völlig angemessen sein."
    pitfalls: ["Provider-Definition von Non-current Assets prüfen."]
    related: [current_asset_intensity, asset_coverage_i]

  asset_coverage_i:
    group: financial_stability
    title_de: "Anlagendeckungsgrad I"
    title_en: "Asset Coverage Ratio I"
    chapter: "3.10"
    kindle_page: 151
    status: keep
    excel_location: "Krones!I149:M154"
    excel_formula: "Equity / Long-term assets (Excel: B63/B41)"
    target_formula: "Eigenkapital / Anlagevermögen"
    raw_data: [total_equity, non_current_assets]
    definition: "Anteil des Anlagevermögens, der durch Eigenkapital finanziert ist."
    meaning: "Prüft die langfristige Fristenkongruenz der Finanzierung."
    interpretation: "Höhere Werte bedeuten mehr langfristige Eigenfinanzierung des Anlagevermögens."
    pitfalls: ["Anlagevermögen muss konsistent abgegrenzt werden."]
    related: [asset_coverage_ii, equity_ratio]

  asset_coverage_ii:
    group: financial_stability
    title_de: "Anlagendeckungsgrad II"
    title_en: "Asset Coverage Ratio II"
    chapter: "3.10"
    kindle_page: 151
    status: keep
    excel_location: "Krones!I162:M162"
    excel_formula: "(Equity + long-term liabilities) / Long-term assets"
    target_formula: "(Eigenkapital + langfristiges Fremdkapital) / Anlagevermögen"
    raw_data: [total_equity, long_term_liabilities, non_current_assets]
    definition: "Setzt langfristig verfügbares Kapital zum Anlagevermögen ins Verhältnis."
    meaning: "Zeigt, ob langfristig gebundene Vermögenswerte auch langfristig finanziert sind."
    interpretation: "Werte über 100 % sprechen grundsätzlich für eine bessere Fristenkongruenz."
    pitfalls: ["Langfristige Rückstellungen und Leasing konsistent definieren."]
    related: [asset_coverage_i, current_ratio]

  goodwill_share:
    group: financial_stability
    title_de: "Goodwill-Anteil"
    title_en: "Goodwill Share"
    chapter: "3.11"
    kindle_page: 153
    status: keep_manual_to_api
    excel_location: "Krones!I169:M174"
    excel_formula: "Goodwill / Equity (Excel uses manually entered Goodwill / equity)"
    target_formula: "Goodwill / Eigenkapital; Buchdefinition verifizieren"
    raw_data: [goodwill, total_equity]
    definition: "Setzt bilanzierten Goodwill in Relation zur Eigenkapitalbasis."
    meaning: "Macht sichtbar, wie stark das bilanzielle Eigenkapital von Akquisitionsgoodwill geprägt ist."
    interpretation: "Ein hoher Anteil erhöht die Bedeutung möglicher Impairments und sollte bei der Bilanzqualität berücksichtigt werden."
    pitfalls: ["Goodwill ist nicht automatisch schlecht; entscheidend ist die Werthaltigkeit der erworbenen Geschäftsmodelle."]
    related: [intangibles_to_assets, equity_ratio]

  interest_coverage:
    group: excel_extension
    title_de: "Zinsdeckungsgrad"
    title_en: "Interest Coverage"
    chapter: null
    kindle_page: null
    status: keep_excel_extension
    excel_location: "Krones!I179:M184"
    excel_formula: "EBIT / interest expense (Excel: B12/I183)"
    target_formula: "EBIT / Zinsaufwand"
    raw_data: [ebit, interest_expense]
    definition: "Misst, wie oft das operative Ergebnis den Zinsaufwand deckt."
    meaning: "Ergänzt die Schmidlin-Kennzahlen um einen direkten Blick auf den Schuldendienst."
    interpretation: "Je höher, desto größer typischerweise der Puffer gegen Ergebnisrückgänge."
    pitfalls: ["Zinsaufwand mit negativen Vorzeichen normalisieren."]
    related: [gearing, net_debt_ebitda]

  debt_to_equity:
    group: excel_extension
    title_de: "Debt-to-Equity Ratio"
    title_en: "Debt to Equity"
    chapter: null
    kindle_page: null
    status: keep_excel_extension
    excel_location: "Krones!I189:M192"
    excel_formula: "Total liabilities / Equity (Excel: B56/B63)"
    target_formula: "Gesamtverbindlichkeiten / Eigenkapital"
    raw_data: [total_liabilities, total_equity]
    definition: "Gesamtverbindlichkeiten im Verhältnis zum Eigenkapital."
    meaning: "Ein zusätzlicher Verschuldungsindikator; weniger präzise als Gearing, weil auch nicht verzinsliche Verbindlichkeiten enthalten sind."
    interpretation: "Nur ergänzend verwenden."
    pitfalls: ["Nicht mit Nettofinanzverschuldung verwechseln."]
    related: [gearing, equity_ratio]

  long_term_debt_to_equity:
    group: excel_extension
    title_de: "Long-Term Debt-to-Equity Ratio"
    title_en: "Long-Term Debt to Equity"
    chapter: null
    kindle_page: null
    status: keep_excel_extension
    excel_location: "Krones!I197:M200"
    excel_formula: "Long-term liabilities / Equity"
    target_formula: "Langfristige Verbindlichkeiten / Eigenkapital"
    raw_data: [long_term_liabilities, total_equity]
    definition: "Langfristige Verbindlichkeiten relativ zum Eigenkapital."
    meaning: "Zeigt die strukturelle langfristige Fremdfinanzierung."
    interpretation: "Als Ergänzung zu Gearing und Fälligkeiten verwenden."
    pitfalls: ["Nicht alle langfristigen Verbindlichkeiten sind zinstragend."]
    related: [debt_to_equity, gearing]

  short_term_debt_to_equity:
    group: excel_extension
    title_de: "Short-Term Debt-to-Equity Ratio"
    title_en: "Short-Term Debt to Equity"
    chapter: null
    kindle_page: null
    status: keep_excel_extension
    excel_location: "Krones!I205:M208"
    excel_formula: "Current liabilities / Equity"
    target_formula: "Kurzfristige Verbindlichkeiten / Eigenkapital"
    raw_data: [current_liabilities, total_equity]
    definition: "Kurzfristige Verbindlichkeiten relativ zum Eigenkapital."
    meaning: "Kann auf kurzfristigen Refinanzierungs- und Liquiditätsdruck hinweisen."
    interpretation: "Gemeinsam mit Liquiditätskennzahlen beurteilen."
    pitfalls: ["Lieferantenverbindlichkeiten sind wirtschaftlich anders zu beurteilen als Bankkredite."]
    related: [current_ratio, cash_ratio]

  relative_debt:
    group: excel_extension
    title_de: "Relative Verschuldung"
    title_en: "Liabilities / EBIT"
    chapter: null
    kindle_page: null
    status: keep_excel_extension
    excel_location: "Krones!I213:M216"
    excel_formula: "Total liabilities / EBIT"
    target_formula: "Gesamtverbindlichkeiten / EBIT"
    raw_data: [total_liabilities, ebit]
