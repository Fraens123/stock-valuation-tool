    interpretation: "Nur verwenden, wenn Cashflow-Zähler und EV ökonomisch zu denselben Kapitalgebern gehören."
    pitfalls: ["Im bestehenden Excel ist die FCF-Formel speziell; in Phase 5 fachlich neu validieren."]
    related: [enterprise_value, free_cash_flow]

  ev_sales:
    group: valuation_multiples
    title_de: "EV/Sales"
    title_en: "EV / Sales"
    chapter: "7.9"
    kindle_page: 284
    status: keep_after_ev_fix
    excel_location: "Krones!A462:B466"
    excel_formula: "Enterprise Value / Revenue"
    target_formula: "Enterprise Value / Umsatz"
    raw_data: [enterprise_value, revenue]
    definition: "Enterprise Value relativ zum Umsatz."
    meaning: "Bewertet Umsatz unabhängig von Kapitalstruktur, ist aber ohne Margenkontext unvollständig."
    interpretation: "Höhere EV/Sales können bei strukturell hohen Margen gerechtfertigt sein."
    pitfalls: ["Margen und Kapitalrenditen zwingend daneben anzeigen."]
    related: [ps, return_on_sales]

  owner_earnings:
    group: dcf
    title_de: "Owner Earnings"
    title_en: "Owner Earnings"
    chapter: "8.1.1"
    kindle_page: 295
    status: keep_dcf_v1_then_improve
    excel_location: "Krones!A480:P520"
    excel_formula: "Net Income + D&A - Capex - ΔWorking Capital (Excel row 520)"
    target_formula: "Equity-Cashflow/Owner-Earnings-Definition gegen Buch und DCF-Konsistenz abschließend validieren"
    raw_data: [net_income, depreciation_amortization, capex, accounts_receivable, inventory, accounts_payable]
    definition: "Dem Eigenkapital wirtschaftlich zurechenbarer Zahlungsstrom nach notwendigen Investitionen und zusätzlicher Working-Capital-Bindung."
    meaning: "Kerncashflow des Equity-DCF und damit Grundlage des inneren Werts in der aktuellen Schmidlin-/Excel-Logik."
    interpretation: "Muss aus wirtschaftlich zusammenhängenden Prognosen für Umsatz, Marge, Investitionen und Working Capital entstehen."
    pitfalls: ["CAPEX darf nicht unabhängig vom Wachstum geschätzt werden.", "ΔWC muss als Veränderung, nicht WC-Bestand abgezogen werden."]
    related: [cost_of_equity, terminal_value, fair_value_per_share]

  cost_of_equity:
    group: dcf
    title_de: "Eigenkapitalkosten / Diskontierungsfaktor"
    title_en: "Cost of Equity"
    chapter: "8.1.1"
    kindle_page: 295
    status: open_methodology
    excel_location: "Krones!A523:B535"
    excel_formula: "Risk-free rate + 1/Fair P/E + additional minimum-cost adjustment"
    target_formula: "Schmidlin-Risikoaufschlagslogik mit eigenem Risiko-KGV prüfen; Wachstum nicht doppelt berücksichtigen"
    raw_data: [risk_free_rate, risk_rating]
    definition: "Geforderte Rendite des Eigenkapitalgebers, mit der zukünftige Equity-Cashflows abgezinst werden."
    meaning: "Der Diskontsatz bildet Zeitwert und Risiko ab und hat großen Einfluss auf den DCF-Wert."
    interpretation: "Nicht als präzise Naturkonstante behandeln; Bandbreiten und Sensitivität zeigen."
    pitfalls: ["Wachstum nicht doppelt im Cashflow und im Diskontsatz belohnen.", "Risikofreien Zins zum Bewertungszeitpunkt speichern."]
    related: [fair_pe, terminal_value]

  terminal_growth:
    group: dcf
    title_de: "Ewige Wachstumsrate"
    title_en: "Terminal Growth Rate"
    chapter: "8.1.1"
    kindle_page: 295
    status: keep_with_guardrails
    excel_location: "Krones!A543:B552"
    excel_formula: "manual assumption; Excel note suggests 0-4%"
    target_formula: "konservative langfristige Wachstumsannahme, abhängig von Inflation, Markt und Reinvestitionen"
    raw_data: []
    definition: "Langfristige Wachstumsrate nach Ende der expliziten DCF-Planungsperiode."
    meaning: "Bestimmt zusammen mit dem Diskontsatz den Terminal Value und darf nicht wie kurzfristiges Unternehmenswachstum behandelt werden."
    interpretation: "Soll konservativ sein und dauerhaft unter den Eigenkapitalkosten liegen."
    pitfalls: ["Kleine Änderungen haben große Bewertungswirkung.", "g muss kleiner als ke sein."]
    related: [terminal_value, cost_of_equity]

  terminal_value:
    group: dcf
    title_de: "Ewige Rente / Terminal Value"
    title_en: "Terminal Value"
    chapter: "8.1.1"
    kindle_page: 295
    status: keep_with_guardrails
    excel_location: "Krones!A553:B554"
    excel_formula: "OE_10*(1+g)/(ke-g), then discount 10 years"
    target_formula: "Gordon Growth mit nachhaltigen Owner Earnings und konsistentem g/ke"
    raw_data: [owner_earnings, cost_of_equity, terminal_growth]
    definition: "Barwert aller Cashflows nach der expliziten Prognoseperiode."
    meaning: "In vielen DCFs ist der Terminal Value der größte Wertanteil; seine Transparenz ist deshalb zentral."
    interpretation: "Terminal-Value-Anteil am Gesamtwert immer separat ausweisen."
    pitfalls: ["Extrem hohe Terminal-Abhängigkeit als Warnung markieren."]
    related: [owner_earnings, cost_of_equity]

  fair_value_per_share:
    group: dcf
    title_de: "Fairer Aktienkurs / Innerer Wert je Aktie"
    title_en: "Intrinsic Value per Share"
    chapter: "8.1.1"
    kindle_page: 295
    status: adjust_margin_of_safety
    excel_location: "Krones!A557:B564"
    excel_formula: "(PV forecast + PV terminal) / shares; Excel then reduces by Margin of Safety in B564"
    target_formula: "Fair Value separat berechnen; Margin of Safety erst als Kaufgrenze anwenden"
    raw_data: [owner_earnings, terminal_value, diluted_shares]
    definition: "Innerer Eigenkapitalwert je Aktie aus dem DCF."
    meaning: "Zentrale Bewertungsgröße, aber nur so belastbar wie die zugrunde liegenden Cashflow- und Risikoannahmen."
    interpretation: "Als Bandbreite und in mehreren Szenarien anzeigen."
    pitfalls: ["Margin of Safety nicht in die Definition des Fair Value hineinrechnen."]
    related: [margin_of_safety, fair_pe]

  fair_pe:
    group: fair_multiples
    title_de: "Faires Kurs-Gewinn-Verhältnis"
    title_en: "Fair P/E"
    chapter: "8.2.1"
    kindle_page: 351
    status: keep_validate_exact_scoring
    excel_location: "Krones!A572:B701"
    excel_formula: "Base P/E + financial stability + market position*profitability + growth + individuality"
    target_formula: "Schmidlin-Punktelogik gegen Kapitel 8.2.1 vollständig verifizieren"
    raw_data: [normalized_eps]
    definition: "Fundamental abgeleiteter angemessener Gewinnmultiplikator auf Basis qualitativer und quantitativer Unternehmensmerkmale."
    meaning: "Zwingt dazu, Bilanzqualität, Marktposition, Rentabilität und Wachstum vor der Bewertung explizit zu beurteilen."
    interpretation: "Soll als zweite unabhängige Bewertungsmethode neben dem DCF dienen."
    pitfalls: ["Scoring nicht ohne Begründung automatisieren.", "Normalisierten Gewinn verwenden."]
    related: [pe, cost_of_equity, fair_value_per_share]

  fair_pb:
    group: fair_multiples
    title_de: "Faires Kurs-Buchwert-Verhältnis"
    title_en: "Fair P/B"
    chapter: "8.2.2"
    kindle_page: 380
    status: add_later
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch Kapitel 8.2.2 spezifizieren"
    raw_data: [total_equity]
    definition: "Fundamental abgeleitetes angemessenes Kurs-Buchwert-Verhältnis."
    meaning: "Optionale zusätzliche Bewertungsmethode für Geschäftsmodelle, bei denen Buchwerte wirtschaftlich aussagekräftig sind."
    interpretation: "Nicht für alle Unternehmen gleich relevant."
    pitfalls: ["Bei asset-light Unternehmen oft geringe Aussagekraft."]
    related: [pb]

  fair_ps:
    group: fair_multiples
    title_de: "Faires Kurs-Umsatz-Verhältnis"
    title_en: "Fair P/S"
    chapter: "8.2.3"
    kindle_page: 405
    status: add_later
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch Kapitel 8.2.3 spezifizieren"
    raw_data: [revenue]
    definition: "Fundamental abgeleitetes angemessenes Kurs-Umsatz-Verhältnis."
    meaning: "Kann bei Unternehmen mit instabilen Gewinnen als zusätzliche Bewertung dienen, muss aber Margenpotenzial berücksichtigen."
    interpretation: "Nur als Ergänzung verwenden."
    pitfalls: ["Umsatz ohne Profitabilität ist kein Wertmaßstab."]
    related: [ps, return_on_sales]

  fair_ev_ebit:
    group: fair_multiples
    title_de: "Faires Enterprise Value-EBIT-Verhältnis"
    title_en: "Fair EV/EBIT"
    chapter: "8.2.4"
    kindle_page: 409
    status: add_later
    excel_location: null
    excel_formula: null
    target_formula: "gegen Buch Kapitel 8.2.4 spezifizieren"
    raw_data: [ebit, enterprise_value]
    definition: "Fundamental abgeleiteter angemessener EV/EBIT-Multiplikator."
    meaning: "Erweitert die Fair-Multiple-Logik um eine kapitalstrukturneutralere Perspektive."
    interpretation: "Später als Cross-Check zum Fair-KGV und DCF implementieren."
    pitfalls: ["EV-Brücke muss vorher sauber definiert sein."]
    related: [ev_ebit, fair_pe]

  margin_of_safety:
    group: investment_decision
    title_de: "Margin of Safety"
    title_en: "Margin of Safety"
    chapter: "9.1"
    kindle_page: 438
    status: keep_separate_from_fair_value
    excel_location: "Krones!A563:B568"
    excel_formula: "Excel currently multiplies Fair Value by (1-MoS)"
    target_formula: "Kaufgrenze = Fair Value * (1 - Sicherheitsmarge); Fair Value selbst bleibt unverändert"
    raw_data: [fair_value_per_share, market_price]
    definition: "Bewusster Sicherheitsabschlag zwischen geschätztem inneren Wert und gewünschtem Kaufpreis."
    meaning: "Berücksichtigt Modellunsicherheit, Analysefehler und unerwartete negative Entwicklungen."
    interpretation: "Nicht als Teil des inneren Werts darstellen, sondern als separate Entscheidungsschwelle."
    pitfalls: ["Eine höhere Margin of Safety repariert kein schlechtes Bewertungsmodell."]
    related: [fair_value_per_share, fair_pe]
