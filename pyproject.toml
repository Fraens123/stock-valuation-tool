[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-valuation-tool"
version = "0.1.0"
description = "Guided stock analysis and valuation tool."
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.37",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pandas>=2.2",
  "numpy>=2.0",
  "requests>=2.32",
  "plotly>=5.23",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "reportlab>=4.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_valuation = ["knowledge/*.yaml", "data/mappings/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
